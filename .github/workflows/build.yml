# SPDX-License-Identifier: GPL-3.0-only
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The add-on runtime and host come from PillTaskbar_BloomAddon at this commit (main after v0.2.5).
# llvm-mingw and the C++/WinRT headers are set up as in that repository's workflow: the
# release with the LLVM Windhawk's compiler has (20.1.3), its zip's SHA-256 taken from
# winget's manifest for the same zip (MartinStorsjo.LLVM-MinGW.UCRT 20.1.3-20250417).
env:
  PILL_REPO: hyeon1035298/PillTaskbar_BloomAddon
  PILL_REF: 9cc90df194bb46be0b96701167995b3cd442939c
  LLVM_MINGW_VERSION: "20250417"
  LLVM_MINGW_FLAVOR: "ucrt-x86_64"
  LLVM_MINGW_SHA256: "3eba4da7af9e0ad3b736c9ac09f772d4d927da59bfb4e3688003ec21b3ed83fe"
  WINDOWS_SDK_VERSION: "10.0.26100.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PILL_REPO }}
          ref: ${{ env.PILL_REF }}
          path: pill

      - name: Fetch llvm-mingw
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-${LLVM_MINGW_FLAVOR}"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.zip" "$url"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -LiteralPath \"\$env:RUNNER_TEMP\llvm-mingw.zip\" -DestinationPath \"\$env:RUNNER_TEMP\llvm-mingw\""
          echo "CXX=$(cygpath -u "$RUNNER_TEMP")/llvm-mingw/${name}/bin/clang++.exe" >> "$GITHUB_ENV"

      - name: C++/WinRT headers
        run: |
          sdk="/c/Program Files (x86)/Windows Kits/10"
          "$sdk/bin/${WINDOWS_SDK_VERSION}/x64/cppwinrt.exe" -in "$WINDOWS_SDK_VERSION" \
            -out "$(cygpath -w "$RUNNER_TEMP/winrt-headers")"
          echo "CPPWINRT_INCLUDE=$(cygpath -u "$RUNNER_TEMP")/winrt-headers" >> "$GITHUB_ENV"

      - name: Compiler version
        run: '"$CXX" --version'

      - name: Check the tree
        run: python -I pill/tools/check-public.py --root .

      - name: Build
        run: PILL_ROOT=pill bash build.sh

      - name: Write SOURCE.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Runtime and host source: ${GITHUB_SERVER_URL}/${PILL_REPO}"
            echo "Runtime and host commit: ${PILL_REF}"
          } > build/addon/SOURCE.txt

      - name: Stage release files
        run: |
          out="dist/MonitorBrightness_BloomAddon"
          mkdir -p "$out"
          cp LICENSE "$out/"
          for f in MonitorBrightnessHost.exe MonitorBrightnessRuntime.dll MonitorBrightness.dll symbols.txt \
                   addon.json settings.schema.json THIRD_PARTY.md THIRD_PARTY_NOTICES.txt SOURCE.txt; do
            if [ -f "build/addon/$f" ]; then
              cp "build/addon/$f" "$out/"
            elif [ "$f" != SOURCE.txt ]; then
              echo "missing build/addon/$f" >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -f "$out/SOURCE.txt" ]]; then
            echo "SOURCE.txt missing on a tag build" >&2
            exit 1
          fi
          ls -l "$out"

      - name: Zip
        run: |
          name="MonitorBrightness_BloomAddon-${GITHUB_REF_NAME//\//-}"
          (cd dist/MonitorBrightness_BloomAddon && 7z a -tzip "../${name}.zip" . >/dev/null)
          (cd dist && sha256sum "${name}.zip" | tee "${name}.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: addon
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
