# The add-on's names, set here only. build.sh hands this file to PillTaskbar's
# tools/build-addon.sh, whose addon/addon.conf describes every key.
# Paths are relative to this file's folder. Lists are space separated.

ADDON_ID="brightness"
ADDON_NAME="MonitorBrightness"
ADDON_VERSION="0.2.0"
ADDON_MOD_SRC="mod/brightness.wh.cpp"
ADDON_MOD_VERSION="0.2.0"
# Never a Windhawk mod; an id no one uses keeps the Windhawk check quiet.
ADDON_WINDHAWK_MODS="local@brightness"
# The taskbar.dll symbols that lead to the taskbar's XAML.
ADDON_SYMBOL_MODULES="taskbar.dll"
# The schema is this folder's settings.schema.json; build.sh adds it to the bundle. It describes
# the window's settings, kept in prefs.json in the data folder (Bloom reads and writes it there),
# and pill.theme and pill.glass, which Bloom sets to its own look.
ADDON_SCHEMA="0"
ADDON_VALUES_DEFAULTS=""
ADDON_THIRD_PARTY="THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="모니터 밝기 조정"
ADDON_NAME_EN="Monitor Brightness"
ADDON_ABOUT_KO="작업표시줄에서 모니터마다 밝기를 맞추고, 단축키와 유휴 시 어둡게를 씁니다"
ADDON_ABOUT_EN="Sets each monitor's brightness from the taskbar, with hotkeys and dimming when idle"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/MonitorBrightness_BloomAddon"
ADDON_MIN_BLOOM="1.0.0"
ADDON_NEEDS=""
